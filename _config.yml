# ---- site ----
title: YadoreZ
tagline: reverse engineering · robotics hacking · AI security
description: >-
  Writeups on Reverse Engineering, Robotics Hacking, and Game Hacking — by YadoreZ.
author: YadoreZ
future: true

# ---- urls ----
url: "https://yadorez.tech"
baseurl: "/"

# ---- socials ----
github_username: yadorezeht
x_username: yadorezeht
linkedin_username: yadorez

# ---- build ----
markdown: kramdown
highlighter: rouge
permalink: /writeups/:title/
timezone: Asia/Manila

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
